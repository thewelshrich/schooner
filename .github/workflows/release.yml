name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, or an existing tag to recover
        required: true
        default: v0.0.0-dev
        type: string
      publish_existing_tag:
        description: Publish an existing annotated tag after a failed release run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      built_at: ${{ steps.metadata.outputs.built_at }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve and validate metadata
        id: metadata
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_PUBLISH_EXISTING_TAG: ${{ inputs.publish_existing_tag }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          publish=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME}"
            publish=true
          else
            version="${MANUAL_VERSION}"
            publish="${MANUAL_PUBLISH_EXISTING_TAG}"
            if [[ "${publish}" != "true" && "${publish}" != "false" ]]; then
              echo "publish_existing_tag must be true or false" >&2
              exit 1
            fi
          fi
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${version}" =~ ${semver} ]]; then
            echo "version must be a v-prefixed semantic version" >&2
            exit 1
          fi
          without_build="${version%%+*}"
          if [[ "${version}" == *+* && "${without_build}" != *-* ]]; then
            echo "stable release versions must not contain build metadata" >&2
            exit 1
          fi
          if [[ "${without_build}" == *-* ]]; then
            prerelease="${without_build#*-}"
            IFS='.' read -ra identifiers <<< "${prerelease}"
            for identifier in "${identifiers[@]}"; do
              if [[ "${identifier}" =~ ^[0-9]+$ && "${#identifier}" -gt 1 && "${identifier}" == 0* ]]; then
                echo "numeric prerelease identifiers must not contain leading zeroes" >&2
                exit 1
              fi
            done
          fi
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            if [[ "${publish}" == "true" ]]; then
              if [[ "${GITHUB_REF}" != "refs/tags/${version}" ]]; then
                echo "existing-tag recovery must run from the matching tag ref" >&2
                exit 1
              fi
            else
              if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
                echo "manual release builds must run from main" >&2
                exit 1
              fi
              workflow_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
              if [[ "${workflow_commit}" != "$(git rev-parse refs/remotes/origin/main^{commit})" ]]; then
                echo "manual release builds must run from the current origin/main commit" >&2
                exit 1
              fi
            fi
          fi
          if [[ "${publish}" == "true" ]]; then
            if [[ "$(git cat-file -t "refs/tags/${version}")" != "tag" ]]; then
              echo "release tags must be annotated" >&2
              exit 1
            fi
            release_notes="$(git for-each-ref --format='%(contents)' "refs/tags/${version}")"
            if [[ -z "${release_notes//[[:space:]]/}" ]]; then
              echo "release tag annotation must contain release notes" >&2
              exit 1
            fi
            commit="$(git rev-parse "refs/tags/${version}^{commit}")"
            event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
            if [[ "${commit}" != "${event_commit}" ]]; then
              echo "release tag target does not match the workflow ref" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "${commit}" refs/remotes/origin/main; then
              echo "release tag must point to a commit contained in main" >&2
              exit 1
            fi
          else
            commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          fi
          built_at="$(date -u -d "$(git show -s --format=%cI "${commit}")" '+%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "version=${version}"
            echo "commit=${commit}"
            echo "built_at=${built_at}"
            echo "publish=${publish}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build native binary
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          BUILT_AT: ${{ needs.prepare.outputs.built_at }}
          GITHUB_CLIENT_ID: ${{ vars.SCHOONER_GITHUB_CLIENT_ID }}
        run: |
          if [[ -z "${GITHUB_CLIENT_ID}" ]]; then
            echo "SCHOONER_GITHUB_CLIENT_ID repository variable is required" >&2
            exit 1
          fi
          if [[ ! "${GITHUB_CLIENT_ID}" =~ ^[A-Za-z0-9._-]+$ || "${#GITHUB_CLIENT_ID}" -gt 128 ]]; then
            echo "SCHOONER_GITHUB_CLIENT_ID repository variable is invalid" >&2
            exit 1
          fi
          if [[ "$(go env GOOS)/$(go env GOARCH)" != "${TARGET_OS}/${TARGET_ARCH}" ]]; then
            echo "runner architecture does not match release target" >&2
            exit 1
          fi
          mkdir -p dist
          artifact="dist/schooner_${VERSION}_${TARGET_OS}_${TARGET_ARCH}"
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.builtAt=${BUILT_AT} -X main.githubClientID=${GITHUB_CLIENT_ID}" \
            -o "${artifact}" \
            ./cmd/schooner

          version_json="$("${artifact}" version --output json)"
          VERSION_JSON="${version_json}" python3 -c '
          import json, os
          value = json.loads(os.environ["VERSION_JSON"])
          expected = {
              "schema_version": "1",
              "version": os.environ["VERSION"],
              "commit": os.environ["COMMIT"],
              "built_at": os.environ["BUILT_AT"],
              "os": os.environ["TARGET_OS"],
              "arch": os.environ["TARGET_ARCH"],
          }
          for key, wanted in expected.items():
              if value.get(key) != wanted:
                  raise SystemExit(f"{key}: got {value.get(key)!r}, want {wanted!r}")
          '

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schooner-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/schooner_*
          if-no-files-found: error
          retention-days: 7

  sign-macos:
    name: Sign and notarize macOS binaries
    needs:
      - prepare
      - build
    runs-on: macos-15
    environment: release
    timeout-minutes: 120
    steps:
      - name: Download macOS binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: schooner-darwin-*
          path: dist
          merge-multiple: true

      - name: Validate Apple release secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          missing=()
          [[ -n "${CERTIFICATE_BASE64}" ]] || missing+=(APPLE_DEVELOPER_ID_P12_BASE64)
          [[ -n "${CERTIFICATE_PASSWORD}" ]] || missing+=(APPLE_DEVELOPER_ID_P12_PASSWORD)
          [[ -n "${NOTARY_KEY_BASE64}" ]] || missing+=(APPLE_NOTARY_KEY_P8_BASE64)
          [[ -n "${NOTARY_KEY_ID}" ]] || missing+=(APPLE_NOTARY_KEY_ID)
          [[ -n "${NOTARY_ISSUER_ID}" ]] || missing+=(APPLE_NOTARY_ISSUER_ID)
          if (( ${#missing[@]} > 0 )); then
            printf 'missing required Apple release secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi
          if [[ ! "${NOTARY_KEY_ID}" =~ ^[A-Za-z0-9]{10,}$ ]]; then
            echo "APPLE_NOTARY_KEY_ID must be an alphanumeric key ID of at least 10 characters" >&2
            exit 1
          fi
          if [[ ! "${NOTARY_ISSUER_ID}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "APPLE_NOTARY_ISSUER_ID must be an issuer UUID" >&2
            exit 1
          fi

      - name: Import Developer ID identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          certificate_path="${RUNNER_TEMP}/developer-id-application.p12"
          intermediate_path="${RUNNER_TEMP}/DeveloperIDG2CA.cer"
          keychain_path="${RUNNER_TEMP}/schooner-signing.keychain-db"
          original_keychains_path="${RUNNER_TEMP}/original-user-keychains.txt"
          keychain_password="$(openssl rand -hex 32)"
          echo "SIGNING_KEYCHAIN=${keychain_path}" >> "${GITHUB_ENV}"

          security list-keychains -d user | \
            sed -E 's/^[[:space:]]*"([^"]+)"[[:space:]]*$/\1/' > "${original_keychains_path}"

          printf '%s' "${CERTIFICATE_BASE64}" | base64 --decode > "${certificate_path}"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "${intermediate_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${CERTIFICATE_PASSWORD}" \
            -f pkcs12 \
            -T /usr/bin/codesign

          expected_intermediate_sha256="$(shasum -a 256 "${intermediate_path}" | awk '{print toupper($1)}')"
          has_expected_intermediate() {
            security find-certificate \
              -a \
              -Z \
              -c "Developer ID Certification Authority" \
              "$@" 2>/dev/null | \
              awk '/SHA-256 hash:/ {print toupper($3)}' | \
              grep -Fxq "${expected_intermediate_sha256}"
          }
          if has_expected_intermediate "${keychain_path}" || has_expected_intermediate; then
            echo "Apple Developer ID G2 intermediate is already available"
          elif ! security import "${intermediate_path}" -k "${keychain_path}"; then
            if has_expected_intermediate "${keychain_path}" || has_expected_intermediate; then
              echo "Apple Developer ID G2 intermediate became available during import"
            else
              echo "failed to import the expected Apple Developer ID G2 intermediate" >&2
              exit 1
            fi
          fi
          if ! has_expected_intermediate "${keychain_path}" && ! has_expected_intermediate; then
            echo "expected Apple Developer ID G2 intermediate is unavailable" >&2
            exit 1
          fi
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"

          identity_hash="$(security find-identity -v -p codesigning "${keychain_path}" | awk '/Developer ID Application:/ {print $2}')"
          identity_count="$(printf '%s\n' "${identity_hash}" | awk 'NF {count++} END {print count+0}')"
          if [[ "${identity_count}" != "1" ]]; then
            echo "expected exactly one Developer ID Application identity, found ${identity_count}" >&2
            exit 1
          fi

          original_keychains=()
          while IFS= read -r original_keychain; do
            [[ -n "${original_keychain}" ]] && original_keychains+=("${original_keychain}")
          done < "${original_keychains_path}"
          security list-keychains \
            -d user \
            -s "${keychain_path}" "${original_keychains[@]}"

          search_identity_count="$(
            security find-identity -v -p codesigning | \
              awk -v expected="${identity_hash}" '$2 == expected {count++} END {print count+0}'
          )"
          if [[ "${search_identity_count}" != "1" ]]; then
            echo "Developer ID identity is unavailable through the Keychain search list" >&2
            exit 1
          fi

          {
            echo "SIGNING_IDENTITY=${identity_hash}"
          } >> "${GITHUB_ENV}"

      - name: Sign and verify macOS binaries
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_TEAM_ID: LDCWNW7T7K
        run: |
          requirement="anchor apple generic and identifier \"app.schooner.cli\" and certificate leaf[subject.OU] = \"${EXPECTED_TEAM_ID}\" and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists"
          for arch in amd64 arm64; do
            artifact="dist/schooner_${VERSION}_darwin_${arch}"
            test -f "${artifact}"
            codesign \
              --force \
              --sign "${SIGNING_IDENTITY}" \
              --options runtime \
              --timestamp \
              --identifier app.schooner.cli \
              "${artifact}"
            codesign --verify --strict --verbose=4 -R="${requirement}" "${artifact}"
          done

      - name: Notarize macOS binaries
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          notary_key_path="${RUNNER_TEMP}/notary-api-key.p8"
          payload_dir="${RUNNER_TEMP}/notary-payload"
          archive_path="${RUNNER_TEMP}/schooner_${VERSION}_darwin.zip"
          result_path="${RUNNER_TEMP}/notary-result.json"
          log_path="${RUNNER_TEMP}/notarization-log.json"

          printf '%s' "${NOTARY_KEY_BASE64}" | base64 --decode > "${notary_key_path}"
          chmod 600 "${notary_key_path}"
          mkdir -p "${payload_dir}"
          cp "dist/schooner_${VERSION}_darwin_amd64" "${payload_dir}/"
          cp "dist/schooner_${VERSION}_darwin_arm64" "${payload_dir}/"
          ditto -c -k --keepParent "${payload_dir}" "${archive_path}"

          xcrun notarytool submit "${archive_path}" \
            --key "${notary_key_path}" \
            --key-id "${NOTARY_KEY_ID}" \
            --issuer "${NOTARY_ISSUER_ID}" \
            --wait \
            --timeout 110m \
            --output-format json | tee "${result_path}"

          NOTARY_RESULT_PATH="${result_path}" python3 -c '
          import json, os
          with open(os.environ["NOTARY_RESULT_PATH"], encoding="utf-8") as handle:
              result = json.load(handle)
          if result.get("status") != "Accepted":
              raise SystemExit("notarization status: {!r}".format(result.get("status")))
          '
          submission_id="$(NOTARY_RESULT_PATH="${result_path}" python3 -c '
          import json, os
          with open(os.environ["NOTARY_RESULT_PATH"], encoding="utf-8") as handle:
              print(json.load(handle)["id"])
          ')"
          xcrun notarytool log "${submission_id}" \
            --key "${notary_key_path}" \
            --key-id "${NOTARY_KEY_ID}" \
            --issuer "${NOTARY_ISSUER_ID}" \
            "${log_path}"
          NOTARY_LOG_PATH="${log_path}" python3 -c '
          import json, os
          with open(os.environ["NOTARY_LOG_PATH"], encoding="utf-8") as handle:
              result = json.load(handle)
          if result.get("status") != "Accepted" or result.get("statusCode") != 0:
              raise SystemExit("notarization log does not report an accepted submission")
          if result.get("issues") not in (None, []):
              raise SystemExit("notarization reported issues: {!r}".format(result.get("issues")))
          '

      - name: Upload signed macOS binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schooner-darwin-signed
          path: dist/schooner_*
          if-no-files-found: error
          retention-days: 7

      - name: Upload notarization log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schooner-${{ needs.prepare.outputs.version }}-notarization-log
          path: ${{ runner.temp }}/notarization-log.json
          if-no-files-found: error
          retention-days: 90

      - name: Delete temporary signing material
        if: always()
        run: |
          original_keychains_path="${RUNNER_TEMP}/original-user-keychains.txt"
          if [[ -f "${original_keychains_path}" ]]; then
            original_keychains=()
            while IFS= read -r original_keychain; do
              [[ -n "${original_keychain}" ]] && original_keychains+=("${original_keychain}")
            done < "${original_keychains_path}"
            security list-keychains -d user -s "${original_keychains[@]}" || true
          fi
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "${SIGNING_KEYCHAIN}" || true
          fi
          rm -f \
            "${RUNNER_TEMP}/developer-id-application.p12" \
            "${RUNNER_TEMP}/DeveloperIDG2CA.cer" \
            "${RUNNER_TEMP}/notary-api-key.p8" \
            "${original_keychains_path}"

  bundle:
    name: Verify and bundle artifacts
    needs:
      - prepare
      - build
      - sign-macos
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download Linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: schooner-linux-*
          path: dist
          merge-multiple: true

      - name: Download signed macOS binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: schooner-darwin-signed
          path: dist

      - name: Package and verify release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILT_AT: ${{ needs.prepare.outputs.built_at }}
        run: |
          python3 scripts/package_release.py \
            --version "${VERSION}" \
            --built-at "${BUILT_AT}" \
            --source-root . \
            --dist dist
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload verified bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schooner-${{ needs.prepare.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  install-smoke:
    name: Install smoke ${{ matrix.os }}/${{ matrix.arch }}
    needs:
      - prepare
      - bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download verified bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: schooner-${{ needs.prepare.outputs.version }}
          path: dist

      - name: Install and verify packaged executable
        run: scripts/release_install_smoke.sh "${{ needs.prepare.outputs.version }}" dist

  publish:
    name: Publish release
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - bundle
      - install-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Download verified bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: schooner-${{ needs.prepare.outputs.version }}
          path: dist

      - name: Attest release executables and archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/schooner_*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          release_flags=()
          prerelease=false
          without_build="${VERSION%%+*}"
          if [[ "${without_build}" == *-* ]]; then
            prerelease=true
            release_flags+=(--prerelease)
          fi
          release_notes="$(git for-each-ref --format='%(contents)' "refs/tags/${VERSION}")"
          if [[ -z "${release_notes//[[:space:]]/}" ]]; then
            echo "release tag annotation must contain release notes" >&2
            exit 1
          fi
          generated_notes_json="$(
            gh api \
              --method POST \
              "repos/${GH_REPO}/releases/generate-notes" \
              -f tag_name="${VERSION}"
          )"
          release_body_path="${RUNNER_TEMP}/release-body.md"
          RELEASE_NOTES="${release_notes}" \
          GENERATED_NOTES_JSON="${generated_notes_json}" \
          RELEASE_BODY_PATH="${release_body_path}" \
            python3 -c '
          import json, os
          narrative = os.environ["RELEASE_NOTES"].strip()
          generated = json.loads(os.environ["GENERATED_NOTES_JSON"]).get("body", "").strip()
          body = "\n\n".join(part for part in (narrative, generated) if part)
          with open(os.environ["RELEASE_BODY_PATH"], "w", encoding="utf-8") as handle:
              handle.write(body + "\n")
          '

          if existing_release="$(
            gh release view "${VERSION}" \
              --json body,isDraft,isImmutable,isPrerelease,name,tagName 2>/dev/null
          )"; then
            EXISTING_RELEASE="${existing_release}" \
            EXPECTED_BODY="$(<"${release_body_path}")" \
            EXPECTED_VERSION="${VERSION}" \
            EXPECTED_PRERELEASE="${prerelease}" \
              python3 -c '
            import json, os
            release = json.loads(os.environ["EXISTING_RELEASE"])
            expected_version = os.environ["EXPECTED_VERSION"]
            expected_prerelease = os.environ["EXPECTED_PRERELEASE"] == "true"
            checks = {
                "draft": release.get("isDraft") is True,
                "mutable": release.get("isImmutable") is False,
                "tag": release.get("tagName") == expected_version,
                "title": release.get("name") == expected_version,
                "prerelease": release.get("isPrerelease") is expected_prerelease,
                "notes": release.get("body", "").rstrip() == os.environ["EXPECTED_BODY"].rstrip(),
            }
            failed = [name for name, passed in checks.items() if not passed]
            if failed:
                raise SystemExit("existing release is not the expected resumable draft: " + ", ".join(failed))
            '
            echo "resuming matching draft release ${VERSION}"
          else
            gh release create "${VERSION}" \
              --draft \
              --verify-tag \
              --notes-file "${release_body_path}" \
              --title "${VERSION}" \
              "${release_flags[@]}"
          fi

          gh release upload "${VERSION}" dist/* --clobber
          uploaded_assets="$(gh release view "${VERSION}" --json assets)"
          UPLOADED_ASSETS="${uploaded_assets}" VERSION="${VERSION}" python3 -c '
          import json, os
          version = os.environ["VERSION"]
          expected = sorted([
              "SHA256SUMS",
              f"schooner_{version}_darwin_amd64",
              f"schooner_{version}_darwin_amd64.tar.gz",
              f"schooner_{version}_darwin_arm64",
              f"schooner_{version}_darwin_arm64.tar.gz",
              f"schooner_{version}_linux_amd64",
              f"schooner_{version}_linux_amd64.tar.gz",
              f"schooner_{version}_linux_arm64",
              f"schooner_{version}_linux_arm64.tar.gz",
          ])
          actual = sorted(asset["name"] for asset in json.loads(os.environ["UPLOADED_ASSETS"])["assets"])
          if actual != expected:
              raise SystemExit(f"draft release assets: got {actual!r}, want {expected!r}")
          '

          gh release edit "${VERSION}" \
            --draft=false \
            --verify-tag \
            --notes-file "${release_body_path}" \
            --title "${VERSION}" \
            --prerelease="${prerelease}"

      - name: Start non-gating distribution rollout
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          without_build="${VERSION%%+*}"
          if [[ "${without_build}" == *-* ]]; then
            echo "prerelease ${VERSION} does not update the stable Homebrew formula"
            exit 0
          fi
          if ! release_id="$(gh api "repos/${GH_REPO}/releases/tags/${VERSION}" --jq .id)"; then
            echo "::warning::The immutable release succeeded, but distribution rollout dispatch failed. Recover it manually from the Distribution rollout workflow."
            exit 0
          fi
          if ! gh api \
            --method POST \
            "repos/${GH_REPO}/dispatches" \
            -f event_type=release-published \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[release_id]=${release_id}" \
            -f "client_payload[tag_commit]=${TAG_COMMIT}"; then
            echo "::warning::The immutable release succeeded, but distribution rollout dispatch failed. Recover it manually from the Distribution rollout workflow."
          fi
